name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.3

      - name: Check OpenTofu format
        run: tofu -chdir=infra fmt -check -recursive

      - name: Initialize OpenTofu without a backend
        run: tofu -chdir=infra init -backend=false -input=false

      - name: Validate OpenTofu
        run: tofu -chdir=infra validate

      - name: Test OpenTofu behavior
        run: tofu -chdir=infra test

      - name: Test deployment contract
        run: |
          bash infra/tests/deployment_contract_test.sh
          bash infra/tests/deployment_flow_test.sh
          bash infra/tests/secret_preparation_test.sh

      - name: Check shell syntax
        run: bash -n infra/scripts/*.sh infra/tests/*.sh

  js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Security: keep CI on the same Node line as dependency-install jobs.
          node-version: '24.5.0'

      - name: Check JavaScript syntax
        run: find src -path '*/static/*.js' -exec node --check {} \;

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Security: Node must be new enough to run the pinned npm with package age enforcement.
          node-version: '24.5.0'

      - name: Install pinned npm
        # Security: npm 11.10+ enforces min-release-age from .npmrc.
        run: npm install -g npm@11.11.1

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.10.0"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.10.0"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run basedpyright
        run: uv run basedpyright --level error src/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.10.0"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run vulture
        run: uv run vulture

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.10.0"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run bandit
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Run dependency audit
        # GHSA-6v7p-g79w-8964 affects msgpack via pip-audit's CacheControl
        # dependency. The fixed msgpack release is still blocked by the repo's
        # package-age resolver, so keep this exception narrow and temporary.
        run: uv run pip-audit --ignore-vuln GHSA-6v7p-g79w-8964 --ignore-vuln CVE-2026-69247

  # E2E tests using Playwright with Chromium for browser automation.
  e2e:
    runs-on: ubuntu-latest
    env:
      NETRIAS_API_KEY: ${{ secrets.NETRIAS_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.10.0"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Security: Node must be new enough to run the pinned npm with package age enforcement.
          node-version: '24.5.0'

      - name: Install pinned npm
        # Security: npm 11.10+ enforces min-release-age from .npmrc.
        run: npm install -g npm@11.11.1

      - name: Install npm dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
