<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Chord · Mapping</title>
    <link rel="stylesheet" href="{{ app_path_for(request, 'shared_static', path='tokens.css') }}?v={{ request.app.state.asset_version }}" />
    <link rel="stylesheet" href="{{ app_path_for(request, 'stage_one_static', path='stage_1_upload.css') }}?v={{ request.app.state.asset_version }}" />
    <link rel="stylesheet" href="{{ app_path_for(request, 'stage_two_static', path='stage_2_mappings.css') }}?v={{ request.app.state.asset_version }}" />
  </head>
  <body>
    {% from "progress_tracker.html" import progress_tracker with context %}
    {% call progress_tracker("mapping") %}
      <button id="harmonizeButton" class="btn-3d" type="button" disabled>
        <span class="btn-3d-shadow" aria-hidden="true"></span>
        <span class="btn-3d-edge" aria-hidden="true"></span>
        <span class="btn-3d-front">Harmonize →</span>
      </button>
    {% endcall %}

    <main class="stage-shell stage-shell--mapping">
      <section class="stage-card mapping-card">
        <aside class="filter-sidebar hidden" id="filterSidebar"></aside>
        <div class="mapping-content">
          <div id="mappingLockBanner" class="mapping-lock-banner hidden" role="status"></div>
          <div class="mapping-toolbar">
            <div class="mapping-filter-bar" id="sourceFilter"></div>
            <input type="search" class="mapping-col-search" id="colSearch" placeholder="Filter columns…" aria-label="Filter source columns" autocomplete="off" />
            <span id="columnSearchStatus" class="sr-only" role="status" aria-live="polite"></span>
          </div>

          <div class="mapping-list">
            <div class="mapping-list-head">
              <button id="columnSortBtn" class="mapping-list-head-sort" type="button" aria-label="Sort by column name">
                <span>Your column</span>
                <span class="mapping-list-head-sort-arrow" aria-hidden="true">⇅</span>
              </button>
              <div></div>
              <button id="targetSortBtn" class="mapping-list-head-sort mapping-list-head-sort--center" type="button" aria-label="Sort by target common data element">
                <span>Target common data element</span>
                <span class="mapping-list-head-sort-arrow" aria-hidden="true">⇅</span>
              </button>
              <button id="valueFitSortBtn" class="mapping-list-head-sort" type="button" aria-label="Sort by value fit">
                <span>Value fit</span>
                <span class="mapping-list-head-sort-arrow" aria-hidden="true">⇅</span>
              </button>
              <div></div>
            </div>
            <div id="mappingRows"></div>
          </div>
          <div id="mappingEmptyState" class="mapping-empty hidden"></div>
          <p id="harmonizeError" class="stage-error hidden" role="alert"></p>
        </div>
      </section>
    </main>

    <div class="takeover hidden" id="takeover">
      <div class="takeover-backdrop" data-action="close-takeover"></div>
      <div class="takeover-card" id="takeoverCard"></div>
    </div>

    <script>
      window.stageTwoConfig = {
        analysisStateBase: "/stage-1/analysis",
        choicesEndpoint: {{ app_path_for(request, 'stage_two_save_mapping_choices') | tojson }},
        harmonizeEndpoint: {{ app_path_for(request, 'stage_three_harmonize') | tojson }},
        columnDetailBase: "/stage-2/column-detail",
        dataModelKey: "{{ default_data_model_key }}",
        externalVersionNumber: {{ default_external_version_number|tojson }},
        cdeCatalog: {{ cde_catalog | tojson }},
        stageThreeUrl: {{ app_path_for(request, 'stage_three_entry') | tojson }},
      };
    </script>
    <script type="module" src="{{ app_path_for(request, 'stage_two_static', path='stage_2_mappings.js') }}?v={{ request.app.state.asset_version }}"></script>
  </body>
</html>
