name: CI

on:
  pull_request:
    branches: [main, release/bdf725-production-baseline]
  push:
    branches: [main, release/bdf725-production-baseline]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  js-check:
    runs-on: ubuntu-latest
    steps:
      - &prepare-action-node
        name: Prepare patched runner-owned Node before JavaScript actions
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FORCE_JAVASCRIPT_ACTIONS_TO_NODE24" == true ]]
          case "${ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION:-}" in
            ''|false|0|'$false') ;;
            *) echo 'Insecure action-runtime opt-out is forbidden' >&2; exit 1 ;;
          esac
          runner_executable="$(readlink -f "/proc/$PPID/exe")"
          [[ "${runner_executable##*/}" == Runner.Worker ]]
          [[ "$(uname -sm)" == 'Linux x86_64' ]]
          runtime="$(dirname "$runner_executable")/../externals/node24/bin/node"
          test -x "$runtime"
          test -w "$(dirname "$runtime")"
          echo "Previous runner-owned Node: $("$runtime" --version)"
          preparation="$(mktemp -d "$RUNNER_TEMP/action-node.XXXXXX")"
          # This reviewed hash also appears in config/node-runtime-sha256.txt.
          # The user approved the Node 24.22.1 release-age exception for BDF-725.
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.gz -o "$preparation/node.tar.gz"
          echo "eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c  $preparation/node.tar.gz" | sha256sum --check
          tar -xzf "$preparation/node.tar.gz" -C "$preparation" node-v24.22.1-linux-x64/bin/node
          replacement="$(mktemp "$(dirname "$runtime")/.node-patched.XXXXXX")"
          install -m 755 "$preparation/node-v24.22.1-linux-x64/bin/node" "$replacement"
          [[ "$("$replacement" --version)" == v24.22.1 ]]
          cp "$runtime" "$preparation/previous-node"
          mv "$replacement" "$runtime"
          echo "Prepared runner-owned Node: $("$runtime" --version)"
          sha256sum "$runtime"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Security: keep CI on the same Node line as dependency-install jobs.
          node-version-file: '.nvmrc'

      - name: Check JavaScript syntax
        run: find src -path '*/static/*.js' -exec node --check {} \;

  test-js:
    runs-on: ubuntu-latest
    steps:
      - *prepare-action-node

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Security: Node must be new enough to run the pinned npm with package age enforcement.
          node-version-file: '.nvmrc'

      - name: Install pinned npm
        # Security: npm 11.10+ enforces min-release-age from .npmrc.
        run: npm install -g npm@11.11.1

      - name: Install JS test dependencies
        run: npm ci
        working-directory: tests/js

      - name: Run JS tests
        run: npm test
        working-directory: tests/js

  test:
    runs-on: ubuntu-latest
    steps:
      - *prepare-action-node

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.13.4"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest --tb=short

  type-check:
    runs-on: ubuntu-latest
    steps:
      - *prepare-action-node

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.13.4"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Set up patched Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Install declared JavaScript tools
        run: |
          npm install -g npm@11.11.1
          npm ci
      - name: Run basedpyright
        run: npm run typecheck:py -- --level error src/

  lint:
    runs-on: ubuntu-latest
    steps:
      - *prepare-action-node

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.13.4"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run vulture
        run: uv run vulture

  security:
    runs-on: ubuntu-latest
    steps:
      - *prepare-action-node

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.13.4"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Run bandit
        run: uv run bandit -r src/ -c pyproject.toml

      - name: Run dependency audit
        run: uv run pip-audit --ignore-vuln CVE-2026-69247

  # E2E tests using Playwright with Chromium for browser automation.
  e2e:
    runs-on: ubuntu-latest
    env:
      NETRIAS_API_KEY: ${{ secrets.NETRIAS_API_KEY }}
    steps:
      - *prepare-action-node

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          # Security: pin uv so dependency age enforcement stays stable in CI.
          version: "0.13.4"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        # Security: CI must use the committed lockfile, not silently resolve fresh packages.
        run: uv sync --frozen --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Security: Node must be new enough to run the pinned npm with package age enforcement.
          node-version-file: '.nvmrc'

      - name: Install pinned npm
        # Security: npm 11.10+ enforces min-release-age from .npmrc.
        run: npm install -g npm@11.11.1

      - name: Install npm dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install chromium --with-deps

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
