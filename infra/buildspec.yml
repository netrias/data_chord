version: 0.2

env:
  shell: bash
  variables:
    UV_VERSION: "0.12.3"

phases:
  install:
    commands:
      - curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
      - export PATH="$HOME/.local/bin:$PATH"
  pre_build:
    commands:
      - export PATH="$HOME/.local/bin:$PATH"
      - export GITHUB_TOKEN_FILE="/tmp/data-chord-github-token"
      - infra/scripts/github-app-installation-token.sh "$GITHUB_APP_SECRET_ARN" "$GITHUB_TOKEN_FILE"
      - export GITHUB_INSTALLATION_TOKEN="$(<"$GITHUB_TOKEN_FILE")"
      - export GIT_CONFIG_COUNT=1
      - export GIT_CONFIG_KEY_0="url.https://x-access-token:${GITHUB_INSTALLATION_TOKEN}@github.com/.insteadOf"
      - export GIT_CONFIG_VALUE_0="https://github.com/"
      # Install every test dependency. The production image remains minimal because
      # its Docker build below does not enable the local-inference extra.
      - uv sync --frozen --all-extras
      - uv run ruff check .
      - uv run basedpyright
      - uv run pytest
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - export SOURCE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-}"
      - 'if ! [[ "$SOURCE_TAG" =~ ^[0-9a-f]{40}$ ]]; then echo "CODEBUILD_RESOLVED_SOURCE_VERSION must be a full Git commit"; exit 1; fi'
      # Use the GitHub commit as the image tag so ECS deploys can be traced back
      # to an exact source revision.
      - export IMAGE_TAG="$SOURCE_TAG"
      - 'if aws ecr describe-images --repository-name "$IMAGE_REPO_NAME" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then echo "Image tag already exists and ECR tags are immutable: $IMAGE_TAG"; exit 1; fi'
  build:
    commands:
      - docker build --secret "id=github_token,src=$GITHUB_TOKEN_FILE" -t "$IMAGE_REPO_URI:$IMAGE_TAG" .
      - ': > "$GITHUB_TOKEN_FILE"'
      - unset GITHUB_INSTALLATION_TOKEN GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
  post_build:
    commands:
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" != "1" ]; then echo "Build failed; skipping image push"; exit 1; fi
      - docker push "$IMAGE_REPO_URI:$IMAGE_TAG"
