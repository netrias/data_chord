<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Chord · Review Harmonization</title>
    <link rel="stylesheet" href="{{ app_path_for(request, 'shared_static', path='tokens.css') }}?v={{ request.app.state.asset_version }}" />
    <link rel="stylesheet" href="{{ app_path_for(request, 'stage_one_static', path='stage_1_upload.css') }}?v={{ request.app.state.asset_version }}" />
    <link rel="stylesheet" href="{{ app_path_for(request, 'stage_four_static', path='stage_4_review.css') }}?v={{ request.app.state.asset_version }}" />
  </head>
  <body>
    {% from "progress_tracker.html" import progress_tracker with context %}
    {% call progress_tracker("verify") %}
      <button id="stageFiveButton" class="btn-3d" type="button">
        <span class="btn-3d-shadow" aria-hidden="true"></span>
        <span class="btn-3d-edge" aria-hidden="true"></span>
        <span class="btn-3d-front">Review →</span>
      </button>
    {% endcall %}

    <main class="stage-shell stage-four-shell">
      <section class="batch-progress-panel">
        <div id="batchProgressList" class="batch-progress-list" role="list" aria-live="polite"></div>
        <button id="settingsButton" class="settings-btn" type="button" aria-label="Open settings">
          <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </button>

        <!-- Settings Modal -->
        <dialog id="settingsModal" class="settings-modal">
          <div class="settings-modal-content">
            <div class="settings-modal-header">
              <h2 class="settings-modal-title">Review Settings</h2>
            </div>
            <div class="settings-modal-body">
              <div class="control-group">
                <label for="reviewModeSelect">Review by</label>
                <select id="reviewModeSelect">
                  <option value="column">Column</option>
                  <option value="row">Row</option>
                </select>
              </div>
              <div class="control-group control-group--checkbox">
                <label class="checkbox-label">
                  <input type="checkbox" id="scrollModeCheckbox" />
                  <span class="checkbox-text">Scroll mode</span>
                </label>
              </div>
              <div class="control-group">
                <label for="sortModeSelect">Sort by</label>
                <select id="sortModeSelect">
                  <option value="original" selected>Original order</option>
                  <option value="fidelity-asc">Match fidelity · Lowest first</option>
                  <option value="fidelity-desc">Match fidelity · Highest first</option>
                </select>
              </div>
              <div class="control-group">
                <label for="batchSizeSelect">Grid size</label>
                <select id="batchSizeSelect">
                  <!-- Options populated dynamically based on review mode -->
                </select>
              </div>
              <div class="control-group control-group--checkbox">
                <label class="checkbox-label">
                  <input type="checkbox" id="showCaseOnlyChanges" />
                  <span class="checkbox-text">Show case-only changes</span>
                </label>
              </div>
              <div class="control-group control-group--checkbox">
                <label class="checkbox-label">
                  <input type="checkbox" id="showUnchangedValues" />
                  <span class="checkbox-text">Show conformant unchanged values</span>
                </label>
              </div>
            </div>
            <div class="settings-modal-footer">
              <button id="settingsCloseButton" class="netrias-btn" type="button">Close</button>
            </div>
          </div>
        </dialog>
      </section>

      <section class="stage-card review-grid">
        <div class="review-toolbar">
          <div class="conformance-legend">
            <div class="legend-item legend-item--conformant">
              <span class="legend-icon" aria-hidden="true">✓</span>
              <span class="legend-label">Value matches approved term</span>
            </div>
            <div class="legend-item legend-item--non-conformant">
              <span class="legend-icon" aria-hidden="true">⚠</span>
              <span class="legend-label">Value not in approved terms</span>
            </div>
          </div>
          <div class="batch-actions">
            <button id="previousBatchButton" class="ghost-btn" type="button">← Previous</button>
            <button id="nextBatchButton" class="ghost-btn" type="button">Next →</button>
          </div>
        </div>
        <p id="reviewError" class="stage-error hidden" role="alert"></p>
        <div id="reviewTable" class="review-table" role="table" aria-live="polite"></div>
      </section>
    </main>

    <script>
      window.stageFourConfig = {
        stageFiveUrl: {{ app_path_for(request, 'stage_five_review_page') | tojson }},
        resultsEndpoint: {{ app_path_for(request, 'stage_four_harmonized_rows') | tojson }},
      };
    </script>
    <script type="module" src="{{ app_path_for(request, 'stage_four_static', path='stage_4_review.js') }}?v={{ request.app.state.asset_version }}"></script>
  </body>
</html>
