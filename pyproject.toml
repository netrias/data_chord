[project]
name = "data-chord"
version = "0.1.0"
description = "Data harmonization workflow with Bedrock CDE recommendation and agentic value harmonization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.4,<0.136.0",  # allows Starlette security fix line
    "jinja2>=3.1.4",
    "python-multipart>=0.0.31",  # CVE remediation
    "uvicorn[standard]>=0.30.0",
    "boto3>=1.40.69",
    "cryptography>=50.0.0",
    "httpx>=0.27",
    "netrias_client @ git+https://github.com/netrias/netrias_client.git@2c763bd9fb972ee7035dc44b537a584a477a7c38",
    "openpyxl>=3.1.5",
    "pyarrow>=23.0.1,<24",  # PYSEC-2026-113
    "requests>=2.33.0",  # CVE-2026-25645
    "starlette>=1.3.1,<1.4.0",  # Starlette security fixes via FastAPI
    "agent-experiment",
    "torch>=2.13.0",
    "transformers>=5.15.1",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.17.0",
    "ruff>=0.6.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pip>=26.2",  # CVE remediation for the audited virtualenv pip package
    "pre-commit>=3.8",
    # transitive dep pin for security (CVE remediation)
    "filelock>=3.20.1",  # CVE-2025-68146 (via virtualenv/pre-commit)
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["mocks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "C901",   # mccabe complexity
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # skip assert warnings (used in tests)

[tool.vulture]
paths = ["src", "tests"]
min_confidence = 100

[tool.uv]
# Security: require Python packages to be at least 7 days old before resolution.
# This is an important supply-chain protection against newly published compromised packages.
exclude-newer = "7 days"

[tool.uv.sources]
agent-experiment = { git = "https://github.com/netrias/agentic_harmonization.git", rev = "2c71e1807d5181021944524209b75ecf6c40f025" }
