repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check
        language: system
        types: [python]

      - id: no-cross-stage-imports
        name: no cross-stage imports
        description: "Stages must depend on domain, not on each other"
        entry: ./scripts/check-cross-stage-imports.sh
        language: system
        pass_filenames: false
        types: [python]

      - id: typecheck-js
        name: typecheck javascript
        description: "Check all JavaScript types"
        entry: npm run typecheck
        language: system
        pass_filenames: false
        types: [javascript]
